<!DOCTYPE html>
<html lang="en" data-client="siddhesh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siddhesh's Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Bebas+Neue&family=Caveat:wght@400;600;700&family=Cedarville+Cursive&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Dancing+Script:wght@400;600;700&family=Gaegu:wght@400;700&family=Great+Vibes&family=Herr+Von+Muellerhoff&family=Indie+Flower&family=Gluten&family=Grand+Hotel&family=Kalam:wght@300;400;700&family=Lobster+Two:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700&family=Parisienne&family=Patrick+Hand&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;600;700&family=Sacramento&family=Sail&family=Satisfy&family=Shadows+Into+Light&family=Walter+Turncoat&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="reader-top">
    <a class="btn ghost" href="index.html">← all stories</a>
    <button class="btn primary" id="pdfBtn" style="display:none;">⬇ Download PDF</button>
  </div>
  <div class="story-headline" id="headline" style="display:none;">
    <div class="kicker" id="hlDate"></div>
    <h1 id="hlTitle"></h1>
    <div class="rule"></div>
  </div>
  <div id="stage" class="reader-stage">
    <div class="jw-loader" id="loading">
      <div class="jw-book" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="jw-load-text" id="loadText">turning the page<span class="jw-dots" aria-hidden="true"><b></b><b></b><b></b></span></div>
      <div class="jw-load-bar" aria-hidden="true"><i></i></div>
      <div class="jw-load-note">stories carry their photos with them, so this can take a moment</div>
    </div>
  </div>
  <div class="jw-busy" id="busy">
    <div class="jw-loader">
      <div class="jw-book" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="jw-load-text">building your PDF<span class="jw-dots" aria-hidden="true"><b></b><b></b><b></b></span></div>
      <div class="jw-load-bar" aria-hidden="true"><i></i></div>
      <div class="jw-load-note" id="busyNote">rendering the pages one by one</div>
    </div>
  </div>

<script>
  /* Only client-specific code. DATA_DIR fixes which folder this editor writes to. */
  window.JOURNAL_CLIENT = {
    USERNAME : "laxman-sidhu",
    REPO     : "Journal-Writing",
    DATA_DIR : "Siddhesh-Journal/data",
    TITLE    : "Siddhesh's Journal"
  };
</script>
<script src="../assets/core.js"></script>
<script>
(async function(){
  const J=window.JOURNAL;
  const stage=document.getElementById('stage'), loading=document.getElementById('loading');
  const loadText=document.getElementById('loadText'), pdfBtn=document.getElementById('pdfBtn');

  /* The loader cycles its line so a slow story reads as "working", never as "stuck". */
  const LOAD_LINES=['turning the page','unpacking the photos','smoothing the creases','almost there'];
  let lineAt=0;
  const loadTimer=setInterval(()=>{ lineAt=(lineAt+1)%LOAD_LINES.length; loadText.style.opacity='0';
    setTimeout(()=>{ loadText.firstChild.nodeValue=LOAD_LINES[lineAt]; loadText.style.opacity='1'; }, 280); }, 2400);
  function endLoader(msg){ clearInterval(loadTimer);
    if(msg===undefined){ loading.remove(); return; }
    loading.className='loading'; loading.textContent=msg; }

  const id=new URLSearchParams(location.search).get('id');
  if(!id){ endLoader('No story selected.'); return; }
  let postTitle='Story';
  try{
    const res=await fetch('data/posts/'+encodeURIComponent(id)+'.json?t='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('not found');
    const post=await res.json();
    postTitle = post.title||'Story';
    document.title = postTitle+' — Siddhesh\u2019s Journal';
    document.getElementById('hlTitle').textContent = postTitle;
    document.getElementById('hlDate').textContent = J.formatDate(post.date);
    document.getElementById('headline').style.display='block';
    (post.pages||[]).forEach(pg=> J.renderPageRO(stage, pg));
    endLoader();
    if(!post.pages || post.pages.length===0){ stage.innerHTML='<div class="loading">This story has no pages yet.</div>'; }
    else { pdfBtn.style.display='inline-flex'; }
  }catch(e){ endLoader('Story not found.'); return; }

  /* Videos load nothing until asked: each tile shows its poster, and a click swaps in the
     real player. Starting one returns every other clip to its poster, so several videos can
     share a page without two of them playing over each other. */
  stage.addEventListener('click',(e)=>{
    const el=e.target.closest && e.target.closest('.el-video');
    if(!el || !el.__data) return;
    stage.querySelectorAll('.el-video').forEach(o=>{ if(o!==el) J.stopVideo(o, o.__data); });
    J.playVideo(el, el.__data);
  });
  function stopAllVideos(){ stage.querySelectorAll('.el-video').forEach(o=> J.stopVideo(o, o.__data)); }

  // ----- PDF (libraries load only on click, keeping the page fast) -----
  function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load '+src)); document.head.appendChild(s); }); }
  let libsLoaded=false;
  async function ensureLibs(){ if(libsLoaded) return;
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); libsLoaded=true; }
  const PDF_BG=(getComputedStyle(document.documentElement).getPropertyValue('--pdf-bg')||'#ffffff').trim();
  const busy=document.getElementById('busy'), busyNote=document.getElementById('busyNote');
  pdfBtn.onclick=async()=>{
    const pages=[...stage.querySelectorAll('.page')];
    if(!pages.length) return;
    const orig=pdfBtn.textContent; pdfBtn.disabled=true; pdfBtn.textContent='Preparing...';
    const spots=pages.map(p=>p.parentNode);            // each page's own .page-scaler
    const savedBodyOv=document.body.style.overflowX;
    /* html2canvas masks a shadow fill against a rectangle the size of the output canvas,
       but lays that rectangle out in DOCUMENT coordinates, so any part of the element
       sitting past it is left with a winding number of -1 and gets filled instead of
       skipped. Every page below the first starts lower down the document than that
       rectangle reaches, which is what flooded them with the page's inset box-shadow
       colour and buried the artwork. Rasterising each page from the document origin keeps
       the whole page inside the rectangle, so the mask lands where it should. */
    const host=document.createElement('div');
    host.style.cssText='position:absolute; left:0; top:0; margin:0; padding:0; width:'+J.PAGE_W+'px;';
    /* On screen the page carries a 1px inset hairline and rounded corners. Both sit INSIDE
       the page box, so they print as a ring of --paper-edge and four tinted corners around
       otherwise full-bleed artwork. A sheet of paper has neither, so they come off for the
       capture and go back straight after. */
    const bare=p=>{ p.style.boxShadow='none'; p.style.borderRadius='0'; };
    const dressed=p=>{ p.style.boxShadow=''; p.style.borderRadius=''; };
    const restore=()=>{ pages.forEach((p,i)=>{ dressed(p); spots[i].appendChild(p); }); host.remove();
      document.body.style.overflowX=savedBodyOv; busy.classList.remove('open');
      window.dispatchEvent(new Event('resize')); };
    try{
      await ensureLibs();
      /* html2canvas cannot rasterise an <iframe> or a playing <video>, so put every clip
         back to its poster first; the PDF then gets the poster and its play badge. */
      stopAllVideos();
      if(document.fonts && document.fonts.ready) await document.fonts.ready;
      busy.classList.add('open');
      document.body.style.overflowX='visible';
      document.body.insertBefore(host, document.body.firstChild);
      /* lay the clone out wide enough for a full-width page, so a narrow phone viewport
         cannot clip the host either */
      const winW=Math.max(document.documentElement.clientWidth, J.PAGE_W+80);
      const { jsPDF }=window.jspdf; let pdf=null;
      for(let i=0;i<pages.length;i++){
        pdfBtn.textContent='Page '+(i+1)+'/'+pages.length;
        busyNote.textContent='page '+(i+1)+' of '+pages.length;
        host.appendChild(pages[i]); bare(pages[i]);
        const canvas=await html2canvas(pages[i], {scale:2, backgroundColor:PDF_BG, useCORS:true, logging:false,
          width:J.PAGE_W, height:pages[i].offsetHeight, windowWidth:winW, scrollX:0, scrollY:0});
        dressed(pages[i]); spots[i].appendChild(pages[i]);
        const w=canvas.width, h=canvas.height; const img=canvas.toDataURL('image/jpeg',0.92); const orient=w>h?'l':'p';
        if(!pdf) pdf=new jsPDF({orientation:orient, unit:'px', format:[w,h]}); else pdf.addPage([w,h], orient);
        pdf.addImage(img,'JPEG',0,0,w,h);
      }
      restore();
      pdf.save((postTitle||'journal').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.pdf');
    }catch(err){ restore(); alert('Sorry, the PDF could not be generated. '+(err.message||'')); }
    pdfBtn.disabled=false; pdfBtn.textContent=orig;
  };
})();
</script>
</body>
</html>
